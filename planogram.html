<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planogram Generator</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1f2430;--muted:#6b7280;--line:#dfe3e8;--accent:#2563eb;--bad:#dc2626;--ok:#16a34a;--warn:#d97706}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0}
main{display:grid;grid-template-columns:270px minmax(0,1fr) 310px;gap:12px;padding:12px;align-items:start}
@media(max-width:1100px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.panel h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.panel+.panel{margin-top:12px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
input,select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff;color:inherit}
button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;color:inherit}
button:hover{background:#f0f3f7}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#1d4fd0}
button.danger{color:var(--bad)}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns>button{flex:1 1 auto}
.muted{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:var(--bg);border-radius:6px;padding:6px 8px}
.stat b{display:block;font-size:16px}
.bad{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)}

/* fixture */
#stage{overflow:auto;padding:8px 4px 16px}
#fixture{display:inline-block;background:#e9ecf1;border:2px solid #9aa3b2;border-radius:4px;padding:8px 8px 8px 0}
.fx-title{padding:0 0 6px 62px;font-weight:600}
.shelf{display:flex;align-items:flex-end}
.shelf-label{width:62px;flex:none;font-size:11px;color:var(--muted);padding:0 6px 6px 0;text-align:right}
.shelf-label input{width:52px;padding:2px 4px;font-size:11px;text-align:right}
.shelf-wrap{flex:none}
.shelf-body{position:relative;display:flex;align-items:flex-end;background:#f8f9fb;border-bottom:7px solid #8b6b4a;box-shadow:inset 0 0 0 1px #d6dae1}
.shelf-body.over{background:#eaf1ff}
.shelf-body.full{box-shadow:inset 0 0 0 2px var(--bad)}
.item{flex:none;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.15;overflow:hidden;border:1px solid rgba(0,0,0,.35);cursor:grab;position:relative;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45);user-select:none}
.item.sel{outline:3px solid #f59e0b;outline-offset:-2px;z-index:2}
.item.tall{box-shadow:inset 0 0 0 3px var(--bad)}
.item .fc{position:absolute;right:1px;top:1px;background:rgba(0,0,0,.55);padding:0 3px;border-radius:3px;font-size:9px}
.ind{position:absolute;top:0;bottom:0;width:3px;background:var(--accent);pointer-events:none;z-index:5}
.shelf-info{font-size:11px;color:var(--muted);padding:2px 0 6px 62px}

/* library */
.sku{display:flex;gap:8px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:grab;background:#fff}
.sku:hover{background:#f7f9fc}
.sku .sw{width:14px;height:30px;border-radius:3px;flex:none}
.sku .nm{flex:1;min-width:0}
.sku .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sku .nm .muted{font-size:11px}
.sku button{padding:2px 6px;font-size:12px}
.sku.placed{opacity:.55}
#lib{max-height:420px;overflow:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f2430;color:#fff;padding:8px 14px;border-radius:8px;display:none;max-width:90vw;z-index:50}

@media print{
  header,.panel.noprint,#side-left,#side-right{display:none!important}
  main{display:block;padding:0}
  body{background:#fff}
}
</style>
</head>
<body>
<header>
  <h1>Planogram Generator</h1>
  <button class="primary" id="btnAuto" title="Susun otomatis semua SKU berdasarkan prioritas">Auto-susun</button>
  <button id="btnClear">Kosongkan rak</button>
  <span style="flex:1"></span>
  <button id="btnPng">Ekspor PNG</button>
  <button id="btnCsv">Ekspor CSV</button>
  <button id="btnPrint">Cetak</button>
  <button id="btnSave">Simpan .json</button>
  <button id="btnLoad">Buka .json</button>
  <input type="file" id="fileJson" accept=".json" hidden>
</header>

<main>
  <div id="side-left">
    <section class="panel">
      <h2>Fixture</h2>
      <label>Nama fixture / toko</label>
      <input id="fxName">
      <label>Lebar fixture (cm)</label>
      <input id="fxWidth" type="number" min="30" max="400">
      <label>Jumlah rak</label>
      <div class="row">
        <button id="shMinus">− Rak</button>
        <button id="shPlus">+ Rak</button>
      </div>
      <label>Tinggi default rak baru (cm)</label>
      <input id="shDefH" type="number" min="5" max="100" value="25">
      <label>Zoom</label>
      <input id="zoom" type="range" min="2" max="9" step="0.5">
    </section>

    <section class="panel">
      <h2>Ringkasan</h2>
      <div class="stats" id="stats"></div>
      <div id="warnList" class="muted" style="margin-top:8px"></div>
    </section>

    <section class="panel">
      <h2>Item terpilih</h2>
      <div id="inspector" class="muted">Klik produk di rak untuk mengatur facing / susunan.</div>
    </section>
  </div>

  <section class="panel" style="padding:8px">
    <div id="stage"><div id="fixture"></div></div>
    <div class="muted" style="padding:0 6px 4px">Seret SKU dari daftar ke rak. Seret item di rak untuk memindah. Tekan Delete untuk menghapus item terpilih.</div>
  </section>

  <div id="side-right">
    <section class="panel">
      <h2>Daftar SKU <span class="muted" id="libCount"></span></h2>
      <input id="libSearch" placeholder="Cari SKU / brand…" style="margin-bottom:8px">
      <div id="lib"></div>
    </section>

    <section class="panel">
      <h2 id="formTitle">Tambah SKU</h2>
      <label>Nama</label><input id="fName">
      <div class="row"><div><label>Brand</label><input id="fBrand"></div>
      <div><label>Prioritas</label><select id="fPri"><option value="3">3 – Tinggi</option><option value="2" selected>2 – Sedang</option><option value="1">1 – Rendah</option></select></div></div>
      <div class="row"><div><label>Lebar (cm)</label><input id="fW" type="number" step="0.5" min="1"></div>
      <div><label>Tinggi (cm)</label><input id="fH" type="number" step="0.5" min="1"></div></div>
      <div class="btns" style="margin-top:10px">
        <button class="primary" id="fSave">Simpan SKU</button>
        <button id="fCancel">Batal</button>
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
      <div class="btns">
        <button id="btnImport">Impor SKU (CSV)</button>
        <button id="btnTpl">Template CSV</button>
      </div>
      <input type="file" id="fileCsv" accept=".csv,.txt" hidden>
      <div class="muted" style="margin-top:6px">Kolom: nama, brand, lebar_cm, tinggi_cm, prioritas (1-3)</div>
    </section>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'planogram-v1';
const uid = () => Math.random().toString(36).slice(2, 9);
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : d; };

function sample() {
  const mk = (name, brand, w, h, pri) => ({ id: uid(), name, brand, w, h, pri });
  return [
    mk('Case Clear Tipis', 'Nova', 9, 17, 2), mk('Case Rugged', 'Nova', 9, 17, 1),
    mk('Holder HP', 'Nova', 10, 14, 1), mk('Memory Card 64GB', 'Nova', 6, 9, 1),
    mk('Tempered Glass', 'Aura', 8, 16, 3), mk('TWS Earbuds', 'Aura', 9, 11, 2),
    mk('Earphone Wired', 'Aura', 7, 14, 1), mk('Speaker Mini', 'Aura', 12, 12, 2),
    mk('Kabel USB-C 1m', 'Volt', 7, 18, 3), mk('Charger 20W', 'Volt', 8, 12, 3),
    mk('Powerbank 10000', 'Volt', 8, 15, 2), mk('Adapter OTG', 'Volt', 6, 10, 1),
  ];
}
function fresh() {
  return {
    fixture: { name: 'Gondola Aksesoris A', width: 120,
      shelves: [0, 1, 2, 3].map(() => ({ h: 25, items: [] })) },
    skus: sample(), scale: 5,
  };
}
let S = (() => { try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.fixture) return j; } catch (e) {} return fresh(); })();
let sel = null;        // {shelf, idx}
let drag = null;       // {type:'sku',id} | {type:'item',shelf,idx}
let editId = null;

const sku = id => S.skus.find(k => k.id === id);
const hue = str => { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const color = k => `hsl(${hue(k.brand || k.name)} 45% ${38 + (hue(k.name) % 5) * 4}%)`;
const used = sh => sh.items.reduce((a, it) => a + (sku(it.sku)?.w || 0) * it.f, 0);
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3500);
}
function normalize() {
  S.fixture.shelves.forEach(sh => sh.items = sh.items.filter(it => sku(it.sku)));
}

/* ---------- render ---------- */
function render() {
  normalize(); renderFixture(); renderLib(); renderInspector(); renderStats(); save();
}

function renderFixture() {
  const fx = $('#fixture'), sc = S.scale, W = S.fixture.width * sc;
  fx.innerHTML = '';
  const t = document.createElement('div'); t.className = 'fx-title';
  t.textContent = `${S.fixture.name} — ${S.fixture.width} cm`; fx.appendChild(t);
  S.fixture.shelves.forEach((sh, si) => {
    const row = document.createElement('div'); row.className = 'shelf';
    const lab = document.createElement('div'); lab.className = 'shelf-label';
    lab.innerHTML = `Rak ${si + 1}<br><input type="number" min="5" max="120" value="${sh.h}" data-h="${si}"> cm`;
    const wrap = document.createElement('div'); wrap.className = 'shelf-wrap';
    const body = document.createElement('div'); body.className = 'shelf-body';
    body.dataset.shelf = si; body.style.width = W + 'px'; body.style.height = sh.h * sc + 'px';
    if (used(sh) > S.fixture.width) body.classList.add('full');
    sh.items.forEach((it, ii) => {
      const k = sku(it.sku); const d = document.createElement('div');
      d.className = 'item' + (sel && sel.shelf === si && sel.idx === ii ? ' sel' : '') + (k.h * it.s > sh.h ? ' tall' : '');
      d.draggable = true; d.dataset.shelf = si; d.dataset.idx = ii;
      d.style.width = k.w * it.f * sc + 'px'; d.style.height = Math.min(k.h * it.s, sh.h) * sc + 'px';
      d.style.background = color(k);
      d.title = `${k.name} (${k.brand}) • ${k.w}×${k.h} cm • ${it.f} facing × ${it.s} susun`;
      d.innerHTML = `<span>${k.name}</span>` + (it.f > 1 || it.s > 1 ? `<span class="fc">${it.f}×${it.s}</span>` : '');
      body.appendChild(d);
    });
    wrap.appendChild(body); row.append(lab, wrap); fx.appendChild(row);
    const u = used(sh), pct = Math.round(u / S.fixture.width * 100);
    const info = document.createElement('div'); info.className = 'shelf-info';
    info.innerHTML = `${u.toFixed(1)} / ${S.fixture.width} cm (${pct}%)` + (u > S.fixture.width ? ' <b class="bad">melebihi lebar!</b>' : '');
    fx.appendChild(info);
  });
}

function renderLib() {
  const q = $('#libSearch').value.trim().toLowerCase();
  const placed = new Set(S.fixture.shelves.flatMap(s => s.items.map(i => i.sku)));
  const list = S.skus.filter(k => !q || (k.name + ' ' + k.brand).toLowerCase().includes(q));
  $('#libCount').textContent = `(${S.skus.length}, ${placed.size} terpasang)`;
  $('#lib').innerHTML = list.map(k => `
    <div class="sku ${placed.has(k.id) ? 'placed' : ''}" draggable="true" data-sku="${k.id}" title="Klik dua kali untuk menambah ke rak">
      <div class="sw" style="background:${color(k)}"></div>
      <div class="nm"><div>${esc(k.name)}</div><div class="muted">${esc(k.brand)} • ${k.w}×${k.h} cm • P${k.pri}</div></div>
      <button data-edit="${k.id}" title="Ubah">✎</button>
      <button data-del="${k.id}" class="danger" title="Hapus">×</button>
    </div>`).join('') || '<div class="muted">Tidak ada SKU.</div>';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderInspector() {
  const el = $('#inspector');
  const it = sel && S.fixture.shelves[sel.shelf]?.items[sel.idx];
  if (!it) { el.className = 'muted'; el.textContent = 'Klik produk di rak untuk mengatur facing / susunan.'; return; }
  const k = sku(it.sku), sh = S.fixture.shelves[sel.shelf];
  el.className = '';
  el.innerHTML = `<b>${esc(k.name)}</b><div class="muted">${esc(k.brand)} • ${k.w}×${k.h} cm • Rak ${sel.shelf + 1}</div>
    <div class="row" style="margin-top:8px"><div><label>Facing (lebar)</label><input type="number" min="1" max="30" id="iF" value="${it.f}"></div>
    <div><label>Susun (tinggi)</label><input type="number" min="1" max="10" id="iS" value="${it.s}"></div></div>
    <div class="muted" style="margin-top:6px">Lebar terpakai ${(k.w * it.f).toFixed(1)} cm • tinggi ${(k.h * it.s).toFixed(1)} cm / rak ${sh.h} cm
    ${k.h * it.s > sh.h ? '<br><b class="bad">Terlalu tinggi untuk rak ini</b>' : ''}</div>
    <div class="btns" style="margin-top:8px"><button data-move="-1">← Geser</button><button data-move="1">Geser →</button><button class="danger" id="iDel">Hapus</button></div>`;
}

function renderStats() {
  const sh = S.fixture.shelves, W = S.fixture.width;
  const items = sh.flatMap(s => s.items);
  const uniq = new Set(items.map(i => i.sku)).size;
  const facings = items.reduce((a, i) => a + i.f, 0);
  const util = sh.length ? sh.reduce((a, s) => a + Math.min(used(s), W), 0) / (W * sh.length) * 100 : 0;
  const over = sh.filter(s => used(s) > W).length;
  const tall = sh.reduce((a, s) => a + s.items.filter(i => sku(i.sku).h * i.s > s.h).length, 0);
  const unplaced = S.skus.length - uniq;
  $('#stats').innerHTML = `
    <div class="stat"><b>${uniq}/${S.skus.length}</b>SKU terpasang</div>
    <div class="stat"><b>${facings}</b>Total facing</div>
    <div class="stat"><b>${util.toFixed(0)}%</b>Utilisasi lebar</div>
    <div class="stat"><b class="${over + tall ? 'bad' : 'ok'}">${over + tall}</b>Peringatan</div>`;
  const w = [];
  if (over) w.push(`<span class="bad">${over} rak melebihi lebar fixture.</span>`);
  if (tall) w.push(`<span class="bad">${tall} item lebih tinggi dari rak.</span>`);
  if (unplaced) w.push(`${unplaced} SKU belum ditempatkan.`);
  $('#warnList').innerHTML = w.join('<br>');
}

/* ---------- drag & drop ---------- */
const stage = $('#fixture');
$('#lib').addEventListener('dragstart', e => {
  const el = e.target.closest('.sku'); if (!el) return;
  drag = { type: 'sku', id: el.dataset.sku }; e.dataTransfer.setData('text/plain', 'sku'); e.dataTransfer.effectAllowed = 'copy';
});
stage.addEventListener('dragstart', e => {
  const el = e.target.closest('.item'); if (!el) return;
  drag = { type: 'item', shelf: +el.dataset.shelf, idx: +el.dataset.idx };
  e.dataTransfer.setData('text/plain', 'item'); e.dataTransfer.effectAllowed = 'move';
});
function dropIndex(body, x) {
  const els = [...body.querySelectorAll('.item')];
  for (let i = 0; i < els.length; i++) { const r = els[i].getBoundingClientRect(); if (x < r.left + r.width / 2) return i; }
  return els.length;
}
function clearInd() { document.querySelectorAll('.ind').forEach(n => n.remove()); document.querySelectorAll('.shelf-body.over').forEach(n => n.classList.remove('over')); }
stage.addEventListener('dragover', e => {
  const body = e.target.closest('.shelf-body'); if (!body || !drag) return;
  e.preventDefault(); clearInd(); body.classList.add('over');
  const idx = dropIndex(body, e.clientX), els = body.querySelectorAll('.item');
  const ind = document.createElement('div'); ind.className = 'ind';
  const br = body.getBoundingClientRect();
  let left = 0;
  if (els.length) left = (idx < els.length ? els[idx].getBoundingClientRect().left : els[els.length - 1].getBoundingClientRect().right) - br.left;
  ind.style.left = Math.max(0, left - 1) + 'px'; body.appendChild(ind);
});
stage.addEventListener('dragleave', e => { if (!stage.contains(e.relatedTarget)) clearInd(); });
document.addEventListener('dragend', () => { drag = null; clearInd(); });
stage.addEventListener('drop', e => {
  const body = e.target.closest('.shelf-body'); if (!body || !drag) return;
  e.preventDefault();
  const si = +body.dataset.shelf; let idx = dropIndex(body, e.clientX);
  const items = S.fixture.shelves[si].items;
  if (drag.type === 'sku') items.splice(idx, 0, { sku: drag.id, f: 1, s: 1 });
  else {
    const it = S.fixture.shelves[drag.shelf].items.splice(drag.idx, 1)[0];
    if (drag.shelf === si && drag.idx < idx) idx--;
    items.splice(idx, 0, it);
  }
  sel = { shelf: si, idx }; drag = null; clearInd(); render();
});

/* ---------- interaksi ---------- */
stage.addEventListener('click', e => {
  const el = e.target.closest('.item');
  sel = el ? { shelf: +el.dataset.shelf, idx: +el.dataset.idx } : null; render();
});
stage.addEventListener('change', e => {
  const h = e.target.dataset.h;
  if (h !== undefined) { S.fixture.shelves[+h].h = num(e.target.value, 25); render(); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { removeSel(); e.preventDefault(); }
});
function removeSel() { if (!sel) return; S.fixture.shelves[sel.shelf].items.splice(sel.idx, 1); sel = null; render(); }
$('#inspector').addEventListener('input', e => {
  const it = sel && S.fixture.shelves[sel.shelf].items[sel.idx]; if (!it) return;
  if (e.target.id === 'iF') it.f = Math.max(1, Math.round(num(e.target.value, 1)));
  if (e.target.id === 'iS') it.s = Math.max(1, Math.round(num(e.target.value, 1)));
  const a = document.activeElement.id; render(); if (a) { const n = $('#' + a); n.focus(); }
});
$('#inspector').addEventListener('click', e => {
  if (e.target.id === 'iDel') return removeSel();
  const m = e.target.dataset.move; if (!m || !sel) return;
  const arr = S.fixture.shelves[sel.shelf].items, j = sel.idx + +m;
  if (j < 0 || j >= arr.length) return;
  [arr[sel.idx], arr[j]] = [arr[j], arr[sel.idx]]; sel.idx = j; render();
});

$('#lib').addEventListener('dblclick', e => {
  const el = e.target.closest('.sku'); if (!el) return;
  const k = sku(el.dataset.sku);
  const si = sel ? sel.shelf : S.fixture.shelves.findIndex(s => used(s) + k.w <= S.fixture.width && k.h <= s.h);
  if (si < 0) return toast('Tidak ada rak yang cukup untuk SKU ini.');
  S.fixture.shelves[si].items.push({ sku: k.id, f: 1, s: 1 }); sel = { shelf: si, idx: S.fixture.shelves[si].items.length - 1 }; render();
});
$('#lib').addEventListener('click', e => {
  if (e.target.dataset.del) {
    const k = sku(e.target.dataset.del);
    if (confirm(`Hapus SKU "${k.name}"? Item ini juga akan dihapus dari rak.`)) { S.skus = S.skus.filter(x => x !== k); sel = null; render(); }
  } else if (e.target.dataset.edit) startEdit(e.target.dataset.edit);
});
$('#libSearch').addEventListener('input', renderLib);

/* form SKU */
function startEdit(id) {
  const k = id && sku(id); editId = id || null;
  $('#formTitle').textContent = k ? 'Ubah SKU' : 'Tambah SKU';
  $('#fName').value = k ? k.name : ''; $('#fBrand').value = k ? k.brand : '';
  $('#fW').value = k ? k.w : ''; $('#fH').value = k ? k.h : ''; $('#fPri').value = k ? k.pri : 2;
  if (k) $('#fName').focus();
}
$('#fCancel').onclick = () => startEdit(null);
$('#fSave').onclick = () => {
  const name = $('#fName').value.trim(), w = num($('#fW').value), h = num($('#fH').value);
  if (!name || !w || !h) return toast('Nama, lebar, dan tinggi wajib diisi.');
  const data = { name, brand: $('#fBrand').value.trim() || '-', w, h, pri: +$('#fPri').value };
  if (editId) Object.assign(sku(editId), data); else S.skus.push({ id: uid(), ...data });
  startEdit(null); render();
};

/* fixture */
function syncFixtureForm() {
  $('#fxName').value = S.fixture.name; $('#fxWidth').value = S.fixture.width; $('#zoom').value = S.scale;
}
$('#fxName').oninput = e => { S.fixture.name = e.target.value; renderFixture(); save(); };
$('#fxWidth').onchange = e => { S.fixture.width = num(e.target.value, 120); render(); };
$('#zoom').oninput = e => { S.scale = +e.target.value; renderFixture(); save(); };
$('#shPlus').onclick = () => { S.fixture.shelves.push({ h: num($('#shDefH').value, 25), items: [] }); render(); };
$('#shMinus').onclick = () => {
  const sh = S.fixture.shelves; if (sh.length <= 1) return;
  if (sh[sh.length - 1].items.length && !confirm('Rak terakhir berisi item. Hapus rak beserta isinya?')) return;
  sh.pop(); sel = null; render();
};

/* auto-susun */
$('#btnAuto').onclick = () => {
  const sh = S.fixture.shelves, W = S.fixture.width;
  if (sh.some(s => s.items.length) && !confirm('Susunan saat ini akan diganti hasil Auto-susun. Lanjutkan?')) return;
  sh.forEach(s => s.items = []); sel = null;
  const eye = Math.round((sh.length - 1) * 0.35);                       // rak setinggi mata ~ 35% dari atas
  const order = [...sh.keys()].sort((a, b) => Math.abs(a - eye) - Math.abs(b - eye) || a - b);
  const list = [...S.skus].sort((a, b) => b.pri - a.pri || a.brand.localeCompare(b.brand) || a.name.localeCompare(b.name));
  const u = sh.map(() => 0), skipped = [];
  const need = list.reduce((a, k) => a + k.w * (k.pri >= 3 ? 2 : 1), 0);
  const soft = Math.min(W, need / sh.length * 1.2);                      // batas isi per rak agar tersebar merata
  for (const k of list) {
    let ok = false;
    for (const cap of [soft, W]) {                                       // pass 1: batas lunak, pass 2: lebar penuh
      for (const si of order) {
        if (k.h > sh[si].h) continue;
        for (let f = k.pri >= 3 ? 2 : 1; f >= 1 && !ok; f--)
          if (u[si] + k.w * f <= cap) { sh[si].items.push({ sku: k.id, f, s: 1 }); u[si] += k.w * f; ok = true; }
        if (ok) break;
      }
      if (ok) break;
    }
    if (!ok) skipped.push(k.name);
  }
  sh.forEach(s => s.items.sort((a, b) => sku(a.sku).brand.localeCompare(sku(b.sku).brand) || sku(a.sku).name.localeCompare(sku(b.sku).name)));
  render();
  toast(skipped.length ? `Tidak muat: ${skipped.join(', ')}` : 'Auto-susun selesai: prioritas tinggi di rak setinggi mata, dikelompokkan per brand.');
};
$('#btnClear').onclick = () => {
  if (!confirm('Kosongkan semua rak?')) return;
  S.fixture.shelves.forEach(s => s.items = []); sel = null; render();
};

/* ---------- ekspor / impor ---------- */
function download(name, content, type) {
  const a = document.createElement('a');
  a.href = typeof content === 'string' ? URL.createObjectURL(new Blob([content], { type })) : content;
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const fname = ext => `planogram_${S.fixture.name.replace(/[^\w-]+/g, '_')}.${ext}`;
const q = v => `"${String(v).replace(/"/g, '""')}"`;

$('#btnCsv').onclick = () => {
  const rows = [['fixture', 'rak', 'tinggi_rak_cm', 'urutan', 'sku', 'brand', 'facing', 'susun', 'posisi_x_cm', 'lebar_cm']];
  S.fixture.shelves.forEach((sh, si) => { let x = 0;
    sh.items.forEach((it, ii) => { const k = sku(it.sku), w = k.w * it.f;
      rows.push([S.fixture.name, si + 1, sh.h, ii + 1, k.name, k.brand, it.f, it.s, +x.toFixed(1), +w.toFixed(1)]); x += w; }); });
  download(fname('csv'), '﻿' + rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
};
$('#btnSave').onclick = () => download(fname('json'), JSON.stringify(S, null, 2), 'application/json');
$('#btnLoad').onclick = () => $('#fileJson').click();
$('#fileJson').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!j.fixture?.shelves || !Array.isArray(j.skus)) throw 0;
    S = j; S.scale = S.scale || 5; sel = null; syncFixtureForm(); render(); toast('Berkas dimuat.');
  } catch (err) { toast('Berkas .json tidak valid.'); }
};
$('#btnPrint').onclick = () => window.print();

$('#btnTpl').onclick = () => download('template_sku.csv',
  '﻿nama,brand,lebar_cm,tinggi_cm,prioritas\nCase Clear Tipis,Nova,9,17,2\nKabel USB-C 1m,Volt,7,18,3\n', 'text/csv');
$('#btnImport').onclick = () => $('#fileCsv').click();
$('#fileCsv').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const lines = (await f.text()).replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  const sep = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length ? ';' : ',';
  const head = /[a-z]/i.test(lines[0].split(sep)[2] || '') ? 1 : 0;
  let n = 0, bad = 0;
  for (const l of lines.slice(head)) {
    const c = l.split(sep).map(s => s.trim().replace(/^"|"$/g, ''));
    const w = num(c[2].replace(',', '.')), h = num((c[3] || '').replace(',', '.'));
    if (!c[0] || !w || !h) { bad++; continue; }
    S.skus.push({ id: uid(), name: c[0], brand: c[1] || '-', w, h, pri: Math.min(3, Math.max(1, parseInt(c[4]) || 2)) }); n++;
  }
  render(); toast(`${n} SKU diimpor` + (bad ? `, ${bad} baris dilewati (data tidak lengkap).` : '.'));
};

$('#btnPng').onclick = () => {
  const sc = 10, W = S.fixture.width * sc, lab = 90, pad = 30, head = 70, foot = 30;
  const H = S.fixture.shelves.reduce((a, s) => a + s.h * sc + 14 + 34, 0);
  const c = document.createElement('canvas'); c.width = lab + W + pad * 2; c.height = head + H + foot;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#1f2430'; g.font = 'bold 28px system-ui,sans-serif'; g.fillText(`${S.fixture.name} — ${S.fixture.width} cm`, pad, 44);
  let y = head;
  S.fixture.shelves.forEach((sh, si) => {
    const hh = sh.h * sc, x0 = pad + lab;
    g.fillStyle = '#f2f4f7'; g.fillRect(x0, y, W, hh);
    g.fillStyle = '#8b6b4a'; g.fillRect(x0, y + hh, W, 14);
    g.fillStyle = '#6b7280'; g.font = '20px system-ui,sans-serif'; g.fillText(`Rak ${si + 1}`, pad, y + hh - 6);
    let x = x0;
    sh.items.forEach(it => { const k = sku(it.sku), w = k.w * it.f * sc, h = Math.min(k.h * it.s, sh.h) * sc;
      g.fillStyle = color(k); g.fillRect(x, y + hh - h, w, h); g.strokeStyle = 'rgba(0,0,0,.4)'; g.strokeRect(x + .5, y + hh - h + .5, w - 1, h - 1);
      g.fillStyle = '#fff'; g.font = '16px system-ui,sans-serif';
      const words = k.name.split(' '); let line = '', ly = y + hh - h + 22;
      for (const wd of words) { const t = line ? line + ' ' + wd : wd;
        if (g.measureText(t).width > w - 8 && line) { g.fillText(line, x + 4, ly); ly += 19; line = wd; } else line = t; }
      g.fillText(line, x + 4, ly);
      if (it.f > 1 || it.s > 1) g.fillText(`${it.f}×${it.s}`, x + 4, y + hh - 6);
      x += w; });
    g.fillStyle = '#6b7280'; g.font = '18px system-ui,sans-serif';
    g.fillText(`${used(sh).toFixed(1)} / ${S.fixture.width} cm`, x0, y + hh + 14 + 22);
    y += hh + 14 + 34;
  });
  g.fillStyle = '#9aa3b2'; g.font = '16px system-ui,sans-serif'; g.fillText(`Dibuat ${new Date().toLocaleDateString('id-ID')}`, pad, c.height - 10);
  download(fname('png'), c.toDataURL('image/png'));
};

/* init */
syncFixtureForm(); startEdit(null); render();
</script>
</body>
