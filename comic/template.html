<title>4 Sekawan Volume 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-height reading stage, slim top bar, bottom page controls, slide-up thumbnail tray */
:root{
  --bg:#f3efe6; --stage:#e4ddcc; --fg:#1d1b17; --muted:#6b6557;
  --accent:#d6361f; --accent-fg:#fff; --sun:#f4b400; --line:#cfc6b0; --bar:#faf7f0;
  --shadow:0 10px 30px rgba(40,30,10,.28);
  --display:"Bangers","Impact",sans-serif; --body:"DM Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14120f; --stage:#1c1915; --fg:#f3ecdc; --muted:#a39a85;
  --accent:#ff6a4d; --accent-fg:#1a0b06; --sun:#ffc62e; --line:#3a352b; --bar:#1b1814;
  --shadow:0 12px 34px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14120f; --stage:#1c1915; --fg:#f3ecdc; --muted:#a39a85;
  --accent:#ff6a4d; --accent-fg:#1a0b06; --sun:#ffc62e; --line:#3a352b; --bar:#1b1814;
  --shadow:0 12px 34px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;min-height:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:1.6rem;letter-spacing:.04em;margin:0;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 span{color:var(--accent)}
.seg{display:flex;border:2px solid var(--fg);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;font-weight:700;font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ico{background:transparent;border:2px solid var(--fg);border-radius:8px;padding:6px 10px;font-weight:700;font-size:.82rem}
.ico[aria-pressed="true"]{background:var(--sun);color:#1d1b17;border-color:#1d1b17}
#stage{position:relative;background:var(--stage);min-height:0;overflow:hidden;touch-action:pan-y}
#book{position:absolute;inset:12px 56px;display:flex;justify-content:center;align-items:center;gap:0}
#book img{max-height:100%;max-width:100%;min-width:0;object-fit:contain;box-shadow:var(--shadow);background:#fff;user-select:none;-webkit-user-drag:none}
#book.spread img{max-width:50%}
#book.spread img:first-child:not(:last-child){border-radius:3px 0 0 3px}
.nav{position:absolute;top:0;bottom:0;width:48px;background:transparent;border:0;font-size:1.8rem;font-weight:700;color:var(--muted);z-index:2}
.nav:hover:not(:disabled){color:var(--accent);background:rgba(127,127,127,.1)}
.nav:disabled{opacity:.2;cursor:default}
#prev{left:0}#next{right:0}
#scroll{position:absolute;inset:0;overflow-y:auto;padding:16px;display:none}
#scroll .col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#scroll img{width:100%;height:auto;box-shadow:var(--shadow);background:#fff;display:block}
#stage.scrollmode #book,#stage.scrollmode .nav{display:none}
#stage.scrollmode #scroll{display:block}
footer{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--bar);border-top:1px solid var(--line)}
#range{flex:1;min-width:0;accent-color:var(--accent)}
#count{font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem;min-width:7.5ch;text-align:right}
#tray{position:absolute;left:0;right:0;bottom:0;background:var(--bar);border-top:2px solid var(--fg);padding:12px 16px;display:none;z-index:5;max-height:55%;overflow-y:auto}
#tray.open{display:block}
#tray .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
#tray button{padding:0;border:3px solid transparent;border-radius:4px;background:none;position:relative;line-height:0}
#tray button[aria-current="true"]{border-color:var(--accent)}
#tray img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px}
#tray b{position:absolute;left:4px;bottom:4px;background:var(--fg);color:var(--bg);font-size:.7rem;padding:1px 6px;border-radius:3px;line-height:1.4}
@media (max-width:640px){
  #book{inset:8px 8px}
  .nav{width:36px;background:rgba(127,127,127,.12);font-size:1.4rem;top:auto;bottom:8px;height:44px;border-radius:8px}
  #prev{left:8px}#next{right:8px}
  h1{font-size:1.3rem}
  .seg [data-mode="spread"]{display:none}
}
@media (prefers-reduced-motion:no-preference){#book img{animation:fade .22s ease}}
@keyframes fade{from{opacity:.0}to{opacity:1}}
</style>

<div id="app">
  <header>
    <h1>4 Sekawan <span>Volume 1</span></h1>
    <div class="seg" role="group" aria-label="Mode baca">
      <button data-mode="single" aria-pressed="true">1 Halaman</button>
      <button data-mode="spread" aria-pressed="false">2 Halaman</button>
      <button data-mode="scroll" aria-pressed="false">Scroll</button>
    </div>
    <button class="ico" id="thumbs" aria-pressed="false">Daftar</button>
    <button class="ico" id="full" aria-label="Layar penuh">Layar penuh</button>
  </header>
  <div id="stage">
    <button class="nav" id="prev" aria-label="Halaman sebelumnya">&#8249;</button>
    <div id="book" aria-live="polite"></div>
    <button class="nav" id="next" aria-label="Halaman berikutnya">&#8250;</button>
    <div id="scroll"><div class="col"></div></div>
    <div id="tray"><div class="grid"></div></div>
  </div>
  <footer>
    <input type="range" id="range" min="0" value="0" aria-label="Geser halaman">
    <span id="count"></span>
  </footer>
</div>

<script>
const PAGES = __PAGES__;
const N = PAGES.length;
const $ = s => document.querySelector(s);
let mode = 'single', cur = 0; // cur = index of the left/only page

try { const m = localStorage.getItem('4s-mode'); if (['single','spread','scroll'].includes(m)) mode = m; } catch(e){}
if (innerWidth <= 640 && mode === 'spread') mode = 'single';

// Spread layout: cover alone, then pairs (1-2, 3-4, ...)
function spreadStart(i){ return i === 0 ? 0 : i - ((i - 1) % 2); }
function visible(){
  if (mode === 'spread') { const s = spreadStart(cur); return s === 0 ? [0] : (s + 1 < N ? [s, s+1] : [s]); }
  return [cur];
}
function step(dir){
  if (mode === 'spread') { const s = spreadStart(cur); cur = dir > 0 ? (s === 0 ? 1 : s + 2) : (s <= 1 ? 0 : s - 2); }
  else cur += dir;
  cur = Math.max(0, Math.min(N - 1, cur));
  render();
}
function label(v){
  const f = i => i === 0 ? 'Cover' : i;
  return v.length === 2 ? `${f(v[0])}–${f(v[1])} / ${N-1}` : (v[0] === 0 ? `Cover` : `${v[0]} / ${N-1}`);
}
function render(){
  const stage = $('#stage');
  stage.classList.toggle('scrollmode', mode === 'scroll');
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  const v = visible();
  if (mode !== 'scroll') {
    const book = $('#book');
    book.className = v.length === 2 ? 'spread' : '';
    book.innerHTML = '';
    v.forEach(i => { const im = new Image(); im.src = PAGES[i]; im.alt = i === 0 ? 'Cover 4 Sekawan Volume 1' : 'Halaman ' + i; im.draggable = false; book.appendChild(im); });
    $('#prev').disabled = v[0] === 0;
    $('#next').disabled = v[v.length-1] === N - 1;
  }
  $('#range').value = v[0];
  $('#count').textContent = label(v);
  document.querySelectorAll('#tray button').forEach((b, i) => b.setAttribute('aria-current', v.includes(i)));
}
function setMode(m){
  mode = m;
  try { localStorage.setItem('4s-mode', m); } catch(e){}
  render();
  if (m === 'scroll') { const t = $('#scroll').querySelectorAll('img')[cur]; if (t) t.scrollIntoView(); }
}

// build scroll column + thumbnails
PAGES.forEach((src, i) => {
  const im = new Image(); im.src = src; im.loading = 'lazy'; im.alt = i === 0 ? 'Cover' : 'Halaman ' + i;
  $('#scroll .col').appendChild(im);
  const b = document.createElement('button');
  b.innerHTML = `<img src="${src}" alt=""><b>${i === 0 ? 'Cover' : i}</b>`;
  b.setAttribute('aria-label', i === 0 ? 'Buka cover' : 'Buka halaman ' + i);
  b.onclick = () => { cur = i; $('#tray').classList.remove('open'); $('#thumbs').setAttribute('aria-pressed','false'); setMode(mode); render(); };
  $('#tray .grid').appendChild(b);
});
$('#range').max = N - 1;
$('#range').oninput = e => { cur = +e.target.value; render(); };
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$('#thumbs').onclick = () => { const o = $('#tray').classList.toggle('open'); $('#thumbs').setAttribute('aria-pressed', o); };
$('#full').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); } catch(e){} };
addEventListener('keydown', e => {
  if (mode === 'scroll' || e.target.id === 'range') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') step(1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') step(-1);
  if (e.key === 'Home') { cur = 0; render(); }
  if (e.key === 'End') { cur = N - 1; render(); }
});
// swipe
let sx = null;
$('#stage').addEventListener('pointerdown', e => { sx = e.clientX; });
$('#stage').addEventListener('pointerup', e => {
  if (sx === null || mode === 'scroll') return;
  const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});
render();
</script>
